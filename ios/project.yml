name: UOSAICompanion
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  UOSAICompanion:
    type: application
    platform: iOS
    sources:
      - path: UOSAICompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.deepin.uos-ai-companion
        PRODUCT_NAME: UOS AI Companion
        INFOPLIST_FILE: UOSAICompanion/Info.plist
  UOSAICompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UOSAICompanionTests
    dependencies:
      - target: UOSAICompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.deepin.uos-ai-companion.tests
  UOSAICompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UOSAICompanionUITests
    dependencies:
      - target: UOSAICompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.deepin.uos-ai-companion.uitests
